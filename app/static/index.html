<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Engineer Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 24px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; color: #f0f6fc; margin-bottom: 24px; }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 20px; margin-bottom: 16px;
  }
  input[type="text"] {
    width: 100%; padding: 8px 12px; background: #0d1117;
    border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9;
    font-size: 0.9rem; outline: none;
  }
  input:focus { border-color: #388bfd; }
  .row { display: flex; gap: 12px; align-items: center; }
  .row input { flex: 1; }
  button {
    padding: 8px 18px; background: #238636; color: #fff; border: none;
    border-radius: 6px; cursor: pointer; font-size: 0.9rem; white-space: nowrap;
  }
  button:hover { background: #2ea043; }
  .activity-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px; margin-top: 16px;
  }
  .ev-card {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    padding: 12px; text-align: center;
  }
  .ev-card .ev-count { font-size: 1.4rem; font-weight: 700; color: #58a6ff; }
  .ev-card .ev-type { font-size: 0.78rem; color: #8b949e; margin-top: 2px; }
  .profile-stats { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 12px; }
  .profile-stat .value { font-size: 1.1rem; font-weight: 600; color: #f0f6fc; }
  .profile-stat .label { font-size: 0.75rem; color: #8b949e; }
  .repo-header { margin-bottom: 16px; }
  .repo-name { font-size: 1.2rem; font-weight: 700; color: #58a6ff; }
  .repo-desc { font-size: 0.875rem; color: #8b949e; margin-top: 4px; }
  .repo-stats { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; }
  .repo-stat .value { font-size: 1.1rem; font-weight: 600; color: #f0f6fc; }
  .repo-stat .label { font-size: 0.75rem; color: #8b949e; }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .topic {
    font-size: 0.75rem; padding: 2px 10px; border-radius: 10px;
    background: #1f3d5c; color: #58a6ff; border: 1px solid #1f6feb44;
  }
  .badge {
    display: inline-block; font-size: 0.7rem; padding: 1px 7px;
    border-radius: 10px; background: #1f6feb; color: #cae8ff; margin-left: 8px;
    vertical-align: middle;
  }
  .badge.cached { background: #3d1f00; color: #e3b341; }
  .type-badge {
    display: inline-block; font-size: 0.7rem; padding: 2px 8px;
    border-radius: 10px; background: #21262d; color: #8b949e;
    border: 1px solid #30363d; margin-left: 8px; vertical-align: middle;
  }
  .hint { font-size: 0.78rem; color: #8b949e; margin-top: 6px; }
  .err { color: #f85149; font-size: 0.85rem; margin-top: 12px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #30363d; border-top-color: #58a6ff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h1>⚙️ GitHub Engineer Dashboard</h1>

<div class="card">
  <div class="row">
    <input type="text" id="urlInput" placeholder="https://github.com/torvalds  or  https://github.com/torvalds/linux" autofocus>
    <button onclick="fetchAnalyze()">Analyze</button>
  </div>
  <div class="hint">User profile URL → activity summary · Repository URL → stars, forks, language…</div>
  <div id="analyzeContent" style="margin-top:14px;"></div>
</div>

<script>
const API = '';

async function fetchAnalyze() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) {
    document.getElementById('analyzeContent').innerHTML =
      '<span class="err">GitHub URL を入力してください</span>';
    return;
  }
  document.getElementById('analyzeContent').innerHTML = '<span class="spinner"></span> Analyzing…';
  try {
    const res = await fetch(`${API}/api/analyze?url=${encodeURIComponent(url)}`);
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || e.error || res.statusText); }
    const result = await res.json();
    if (result.type === 'user') renderUser(result.data);
    else if (result.type === 'repo') renderRepo(result.data);
    else document.getElementById('analyzeContent').innerHTML =
      '<span class="err">未対応のURLタイプです</span>';
  } catch (e) {
    document.getElementById('analyzeContent').innerHTML =
      `<span class="err">Error: ${e.message}</span>`;
  }
}

function renderUser(d) {
  const cachedBadge = d.cached
    ? '<span class="badge cached">cached</span>'
    : '<span class="badge">live</span>';
  const displayName = d.name ? `${d.name} (${d.username})` : d.username;
  const events = Object.entries(d.event_counts).sort((a, b) => b[1] - a[1]);
  const evCards = events.length
    ? events.map(([t, c]) =>
        `<div class="ev-card"><div class="ev-count">${c}</div><div class="ev-type">${t.replace('Event', '')}</div></div>`
      ).join('')
    : '<span style="color:#8b949e;">No recent public events.</span>';
  document.getElementById('analyzeContent').innerHTML = `
    <div>
      <strong style="font-size:1.05rem;">${displayName}</strong>
      <span class="type-badge">user</span>${cachedBadge}
      <div class="profile-stats">
        <div class="profile-stat"><div class="value">${d.public_repos}</div><div class="label">Repos</div></div>
        <div class="profile-stat"><div class="value">${d.followers}</div><div class="label">Followers</div></div>
        <div class="profile-stat"><div class="value">${d.following}</div><div class="label">Following</div></div>
        <div class="profile-stat"><div class="value">${d.total_events}</div><div class="label">Events</div></div>
      </div>
    </div>
    <div class="activity-grid">${evCards}</div>`;
}

function renderRepo(d) {
  const cachedBadge = d.cached
    ? '<span class="badge cached">cached</span>'
    : '<span class="badge">live</span>';
  const desc = d.description ? `<div class="repo-desc">${d.description}</div>` : '';
  const lang = d.language
    ? `<div class="repo-stat"><div class="value">${d.language}</div><div class="label">Language</div></div>`
    : '';
  const topicHtml = (d.topics || []).length
    ? `<div class="topics">${d.topics.map(t => `<span class="topic">${t}</span>`).join('')}</div>`
    : '';
  const updated = d.updated_at
    ? `<div style="font-size:0.78rem;color:#8b949e;margin-top:10px;">Updated: ${d.updated_at.slice(0, 10)}</div>`
    : '';
  document.getElementById('analyzeContent').innerHTML = `
    <div class="repo-header">
      <span class="repo-name">${d.full_name}</span>
      <span class="type-badge">repo</span>${cachedBadge}
      ${desc}
    </div>
    <div class="repo-stats">
      <div class="repo-stat"><div class="value">⭐ ${d.stars.toLocaleString()}</div><div class="label">Stars</div></div>
      <div class="repo-stat"><div class="value">🍴 ${d.forks.toLocaleString()}</div><div class="label">Forks</div></div>
      <div class="repo-stat"><div class="value">${d.open_issues}</div><div class="label">Open Issues</div></div>
      ${lang}
    </div>
    ${topicHtml}
    ${updated}`;
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchAnalyze();
});
</script>
</body>
</html>
