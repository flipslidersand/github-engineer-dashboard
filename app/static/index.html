<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Engineer Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 24px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; color: #f0f6fc; margin-bottom: 24px; }
  h2 { font-size: 1rem; font-weight: 600; color: #f0f6fc; margin-bottom: 12px; }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 20px; margin-bottom: 16px;
  }
  input[type="text"] {
    width: 100%; padding: 8px 12px; background: #0d1117;
    border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9;
    font-size: 0.9rem; outline: none;
  }
  input:focus { border-color: #388bfd; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  .row input { flex: 1; }
  button {
    padding: 8px 18px; background: #238636; color: #fff; border: none;
    border-radius: 6px; cursor: pointer; font-size: 0.9rem; white-space: nowrap;
  }
  button:hover { background: #2ea043; }
  button.secondary {
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
  }
  button.secondary:hover { background: #30363d; }
  .rate-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px; margin-top: 4px;
  }
  .stat { text-align: center; }
  .stat .value { font-size: 1.8rem; font-weight: 700; color: #f0f6fc; }
  .stat .value.warn { color: #d29922; }
  .stat .value.ok { color: #3fb950; }
  .stat .label { font-size: 0.75rem; color: #8b949e; margin-top: 2px; }
  .bar-wrap { background: #0d1117; border-radius: 4px; height: 6px; margin-top: 12px; }
  .bar { height: 6px; border-radius: 4px; background: #3fb950; transition: width 0.4s; }
  .bar.warn { background: #d29922; }
  .bar.danger { background: #f85149; }
  .activity-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px; margin-top: 8px;
  }
  .ev-card {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    padding: 12px; text-align: center;
  }
  .ev-card .ev-count { font-size: 1.4rem; font-weight: 700; color: #58a6ff; }
  .ev-card .ev-type { font-size: 0.78rem; color: #8b949e; margin-top: 2px; }
  .profile { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
  .profile-stats { display: flex; gap: 24px; flex-wrap: wrap; }
  .profile-stat .value { font-size: 1.1rem; font-weight: 600; color: #f0f6fc; }
  .profile-stat .label { font-size: 0.75rem; color: #8b949e; }
  .repo-header { margin-bottom: 16px; }
  .repo-header .repo-name { font-size: 1.2rem; font-weight: 700; color: #58a6ff; }
  .repo-header .repo-desc { font-size: 0.875rem; color: #8b949e; margin-top: 4px; }
  .repo-stats { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; }
  .repo-stat .value { font-size: 1.1rem; font-weight: 600; color: #f0f6fc; }
  .repo-stat .label { font-size: 0.75rem; color: #8b949e; }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .topic {
    font-size: 0.75rem; padding: 2px 10px; border-radius: 10px;
    background: #1f3d5c; color: #58a6ff; border: 1px solid #1f6feb44;
  }
  .badge {
    display: inline-block; font-size: 0.7rem; padding: 1px 7px;
    border-radius: 10px; background: #1f6feb; color: #cae8ff; margin-left: 8px;
    vertical-align: middle;
  }
  .badge.cached { background: #3d1f00; color: #e3b341; }
  .type-badge {
    display: inline-block; font-size: 0.7rem; padding: 2px 8px;
    border-radius: 10px; background: #21262d; color: #8b949e;
    border: 1px solid #30363d; margin-left: 8px; vertical-align: middle;
  }
  .err { color: #f85149; font-size: 0.85rem; margin-top: 8px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #30363d; border-top-color: #58a6ff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #resetCountdown { font-size: 0.8rem; color: #8b949e; margin-top: 8px; }
  .hint { font-size: 0.78rem; color: #8b949e; margin-top: 6px; }
</style>
</head>
<body>
<h1>⚙️ GitHub Engineer Dashboard</h1>

<!-- URL Analyzer -->
<div class="card">
  <h2>Analyze GitHub URL</h2>
  <div class="row" style="margin-bottom:6px;">
    <input type="text" id="urlInput" placeholder="https://github.com/torvalds  or  https://github.com/torvalds/linux" autofocus>
    <button onclick="fetchAnalyze()">Analyze</button>
  </div>
  <div class="hint">User profile URL → activity summary · Repository URL → stars, forks, language…</div>
  <div id="analyzeContent" style="margin-top:14px;"></div>
</div>

<!-- Rate Limit Widget -->
<div class="card">
  <h2>API Rate Limit <button class="secondary" style="font-size:0.75rem;padding:4px 10px;margin-left:8px;" onclick="fetchRateLimit()">Refresh</button></h2>
  <div id="rateContent"><span style="color:#8b949e;">Loading…</span></div>
  <div id="resetCountdown"></div>
</div>

<script>
const API = '';  // same origin

// ── Rate Limit ────────────────────────────────────────────────────────────────
let resetInterval = null;
async function fetchRateLimit() {
  try {
    const res = await fetch(`${API}/api/rate-limit`);
    if (!res.ok) { const e = await res.json(); throw new Error(e.error || res.statusText); }
    renderRateLimit(await res.json());
  } catch (e) {
    document.getElementById('rateContent').innerHTML = `<span class="err">Error: ${e.message}</span>`;
  }
}

function renderRateLimit(d) {
  const pct = d.limit > 0 ? d.remaining / d.limit : 0;
  const barClass = pct > 0.3 ? '' : pct > 0.1 ? 'warn' : 'danger';
  const valClass = pct > 0.3 ? 'ok' : pct > 0.1 ? 'warn' : '';
  const barW = Math.round(pct * 100);
  document.getElementById('rateContent').innerHTML = `
    <div class="rate-grid">
      <div class="stat"><div class="value ${valClass}">${d.remaining.toLocaleString()}</div><div class="label">Remaining</div></div>
      <div class="stat"><div class="value">${d.limit.toLocaleString()}</div><div class="label">Limit</div></div>
      <div class="stat"><div class="value">${d.used.toLocaleString()}</div><div class="label">Used</div></div>
    </div>
    <div class="bar-wrap"><div class="bar ${barClass}" style="width:${barW}%"></div></div>`;
  startCountdown(d.reset);
}

function startCountdown(resetEpoch) {
  if (resetInterval) clearInterval(resetInterval);
  function tick() {
    const secs = Math.max(0, resetEpoch - Math.floor(Date.now() / 1000));
    const m = Math.floor(secs / 60), s = secs % 60;
    document.getElementById('resetCountdown').textContent =
      secs > 0 ? `Resets in ${m}m ${s}s` : 'Resetting…';
  }
  tick();
  resetInterval = setInterval(tick, 1000);
}

// ── URL Analyzer ──────────────────────────────────────────────────────────────
async function fetchAnalyze() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) {
    document.getElementById('analyzeContent').innerHTML =
      '<span class="err">GitHub URL を入力してください</span>';
    return;
  }
  document.getElementById('analyzeContent').innerHTML = '<span class="spinner"></span> Analyzing…';
  try {
    const res = await fetch(`${API}/api/analyze?url=${encodeURIComponent(url)}`);
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || e.error || res.statusText); }
    const result = await res.json();
    if (result.type === 'user') renderUser(result.data);
    else if (result.type === 'repo') renderRepo(result.data);
    else document.getElementById('analyzeContent').innerHTML =
      '<span class="err">未対応のURLタイプです</span>';
  } catch (e) {
    document.getElementById('analyzeContent').innerHTML =
      `<span class="err">Error: ${e.message}</span>`;
  }
}

function renderUser(d) {
  const cachedBadge = d.cached
    ? '<span class="badge cached">cached</span>'
    : '<span class="badge">live</span>';
  const typeBadge = '<span class="type-badge">user</span>';
  const displayName = d.name ? `${d.name} (${d.username})` : d.username;
  const events = Object.entries(d.event_counts).sort((a, b) => b[1] - a[1]);
  const evCards = events.length
    ? events.map(([t, c]) =>
        `<div class="ev-card"><div class="ev-count">${c}</div><div class="ev-type">${t.replace('Event', '')}</div></div>`
      ).join('')
    : '<span style="color:#8b949e;">No recent public events.</span>';
  document.getElementById('analyzeContent').innerHTML = `
    <div class="profile">
      <div>
        <strong style="font-size:1.05rem;">${displayName}</strong>${typeBadge}${cachedBadge}
        <div class="profile-stats" style="margin-top:8px;">
          <div class="profile-stat"><div class="value">${d.public_repos}</div><div class="label">Repos</div></div>
          <div class="profile-stat"><div class="value">${d.followers}</div><div class="label">Followers</div></div>
          <div class="profile-stat"><div class="value">${d.following}</div><div class="label">Following</div></div>
          <div class="profile-stat"><div class="value">${d.total_events}</div><div class="label">Events</div></div>
        </div>
      </div>
    </div>
    <div class="activity-grid">${evCards}</div>`;
}

function renderRepo(d) {
  const cachedBadge = d.cached
    ? '<span class="badge cached">cached</span>'
    : '<span class="badge">live</span>';
  const typeBadge = '<span class="type-badge">repo</span>';
  const desc = d.description
    ? `<div class="repo-desc">${d.description}</div>`
    : '';
  const lang = d.language
    ? `<div class="repo-stat"><div class="value">${d.language}</div><div class="label">Language</div></div>`
    : '';
  const topicHtml = (d.topics || []).length
    ? `<div class="topics">${d.topics.map(t => `<span class="topic">${t}</span>`).join('')}</div>`
    : '';
  const updated = d.updated_at
    ? `<div style="font-size:0.78rem;color:#8b949e;margin-top:10px;">Updated: ${d.updated_at.slice(0, 10)}</div>`
    : '';
  document.getElementById('analyzeContent').innerHTML = `
    <div class="repo-header">
      <span class="repo-name">${d.full_name}</span>${typeBadge}${cachedBadge}
      ${desc}
    </div>
    <div class="repo-stats">
      <div class="repo-stat"><div class="value">⭐ ${d.stars.toLocaleString()}</div><div class="label">Stars</div></div>
      <div class="repo-stat"><div class="value">🍴 ${d.forks.toLocaleString()}</div><div class="label">Forks</div></div>
      <div class="repo-stat"><div class="value">${d.open_issues}</div><div class="label">Open Issues</div></div>
      ${lang}
    </div>
    ${topicHtml}
    ${updated}`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
fetchRateLimit();

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchAnalyze();
});
</script>
</body>
</html>
