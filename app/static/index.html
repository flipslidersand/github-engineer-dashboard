<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Engineer Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 24px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; color: #f0f6fc; margin-bottom: 24px; }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 20px; margin-bottom: 16px;
  }
  input[type="text"] {
    width: 100%; padding: 8px 12px; background: #0d1117;
    border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9;
    font-size: 0.9rem; outline: none;
  }
  input:focus { border-color: #388bfd; }
  .row { display: flex; gap: 12px; align-items: center; }
  .row input { flex: 1; }
  button {
    padding: 8px 18px; background: #238636; color: #fff; border: none;
    border-radius: 6px; cursor: pointer; font-size: 0.9rem; white-space: nowrap;
  }
  button:hover { background: #2ea043; }
  /* stats row */
  .stats { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 12px; }
  .stat-item .value { font-size: 1.1rem; font-weight: 600; color: #f0f6fc; }
  .stat-item .label { font-size: 0.75rem; color: #8b949e; }
  /* event cards */
  .ev-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px; margin-top: 14px;
  }
  .ev-card {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    padding: 12px; text-align: center;
  }
  .ev-card .ev-count { font-size: 1.4rem; font-weight: 700; color: #58a6ff; }
  .ev-card .ev-type { font-size: 0.78rem; color: #8b949e; margin-top: 2px; }
  /* contributor row */
  .contrib-list { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  .contrib-item { display: flex; align-items: center; gap: 8px; }
  .contrib-item img { width: 24px; height: 24px; border-radius: 50%; }
  .contrib-item .c-name { font-size: 0.85rem; color: #c9d1d9; }
  .contrib-item .c-count { font-size: 0.75rem; color: #8b949e; }
  /* language bar */
  .lang-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 14px; }
  .lang-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .lang-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  .lang-item { font-size: 0.78rem; color: #8b949e; display: flex; align-items: center; }
  /* topics */
  .topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .topic {
    font-size: 0.75rem; padding: 2px 10px; border-radius: 10px;
    background: #1f3d5c; color: #58a6ff; border: 1px solid #1f6feb44;
  }
  /* PR/Issue state badge */
  .state-badge {
    display: inline-block; font-size: 0.75rem; font-weight: 600;
    padding: 2px 10px; border-radius: 12px; margin-left: 8px; vertical-align: middle;
  }
  .state-open { background: #1a4f2a; color: #3fb950; }
  .state-closed { background: #3d1f00; color: #f85149; }
  .state-merged { background: #2d1f5e; color: #a371f7; }
  /* diff stats */
  .diff-add { color: #3fb950; font-weight: 600; }
  .diff-del { color: #f85149; font-weight: 600; }
  /* labels */
  .labels { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .label-tag {
    font-size: 0.72rem; padding: 2px 8px; border-radius: 10px;
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
  }
  /* shared */
  .badge {
    display: inline-block; font-size: 0.7rem; padding: 1px 7px;
    border-radius: 10px; background: #1f6feb; color: #cae8ff; margin-left: 8px;
    vertical-align: middle;
  }
  .badge.cached { background: #3d1f00; color: #e3b341; }
  .type-badge {
    display: inline-block; font-size: 0.7rem; padding: 2px 8px;
    border-radius: 10px; background: #21262d; color: #8b949e;
    border: 1px solid #30363d; margin-left: 8px; vertical-align: middle;
  }
  .hint { font-size: 0.78rem; color: #8b949e; margin-top: 6px; }
  .meta { font-size: 0.78rem; color: #8b949e; margin-top: 10px; }
  .section-title { font-size: 0.8rem; font-weight: 600; color: #8b949e; margin-top: 16px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .err { color: #f85149; font-size: 0.85rem; margin-top: 12px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #30363d; border-top-color: #58a6ff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* AI review */
  .review-btn {
    margin-top: 14px; padding: 7px 16px; background: #6e40c9; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  }
  .review-btn:hover { background: #8957e5; }
  .review-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .review-box {
    margin-top: 14px; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; padding: 16px; font-size: 0.85rem; line-height: 1.6;
  }
  .review-box h2 { font-size: 0.95rem; color: #f0f6fc; margin: 12px 0 6px; }
  .review-box h2:first-child { margin-top: 0; }
  .review-box ul { padding-left: 18px; }
  .review-box li { margin: 4px 0; color: #c9d1d9; }
  .review-box p { color: #c9d1d9; margin: 4px 0; }
  .review-box code { background: #1f2937; padding: 1px 5px; border-radius: 3px; font-size: 0.82rem; }
</style>
</head>
<body>
<h1>⚙️ GitHub Engineer Dashboard</h1>

<div class="card">
  <div class="row">
    <input type="text" id="urlInput"
      placeholder="https://github.com/torvalds  ·  /torvalds/linux  ·  /torvalds/linux/pull/1  ·  /issues/1"
      autofocus>
    <button onclick="fetchAnalyze()">Analyze</button>
  </div>
  <div class="hint">User · Repository · Pull Request · Issue に対応</div>
  <div id="analyzeContent" style="margin-top:14px;"></div>
</div>

<script>
const API = '';
const LANG_COLORS = {
  JavaScript:'#f1e05a',TypeScript:'#3178c6',Python:'#3572A5',Go:'#00ADD8',
  Rust:'#dea584',C:'#555555','C++':'#f34b7d','C#':'#178600',Java:'#b07219',
  Ruby:'#701516',PHP:'#4F5D95',Swift:'#F05138',Kotlin:'#A97BFF',Shell:'#89e051',
  HTML:'#e34c26',CSS:'#563d7c',Vue:'#41b883',Dart:'#00B4AB',Scala:'#c22d40',
};
function langColor(name) { return LANG_COLORS[name] || '#8b949e'; }

async function fetchAnalyze() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { show('<span class="err">GitHub URL を入力してください</span>'); return; }
  show('<span class="spinner"></span> Analyzing…');
  try {
    const res = await fetch(`${API}/api/analyze?url=${encodeURIComponent(url)}`);
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || e.error || res.statusText); }
    const result = await res.json();
    const fn = { user: renderUser, repo: renderRepo, pr: renderPR, issue: renderIssue }[result.type];
    fn ? fn(result.data) : show('<span class="err">未対応のURLタイプです</span>');
  } catch (e) { show(`<span class="err">Error: ${e.message}</span>`); }
}

function show(html) { document.getElementById('analyzeContent').innerHTML = html; }

function badges(d, type) {
  const cache = d.cached ? '<span class="badge cached">cached</span>' : '<span class="badge">live</span>';
  return `<span class="type-badge">${type}</span>${cache}`;
}

function renderUser(d) {
  const events = Object.entries(d.event_counts).sort((a,b)=>b[1]-a[1]);
  const evCards = events.length
    ? events.map(([t,c])=>`<div class="ev-card"><div class="ev-count">${c}</div><div class="ev-type">${t.replace('Event','')}</div></div>`).join('')
    : '<span style="color:#8b949e;">No recent public events.</span>';

  const metaParts = [
    d.company ? `🏢 ${d.company}` : '',
    d.location ? `📍 ${d.location}` : '',
    d.blog ? `🔗 <a href="${d.blog}" target="_blank" style="color:#58a6ff;">${d.blog}</a>` : '',
    d.created_at ? `📅 joined ${d.created_at.slice(0,7)}` : '',
  ].filter(Boolean).join(' &nbsp;·&nbsp; ');

  const totalLang = Object.values(d.repo_languages||{}).reduce((a,b)=>a+b,0)||1;
  const langBar = Object.entries(d.repo_languages||{}).map(([l,n])=>
    `<div style="width:${(n/totalLang*100).toFixed(1)}%;background:${langColor(l)};"></div>`).join('');
  const langLegend = Object.entries(d.repo_languages||{}).map(([l,n])=>
    `<span class="lang-item"><span class="lang-dot" style="background:${langColor(l)};"></span>${l} (${n})</span>`).join('');
  const langSection = Object.keys(d.repo_languages||{}).length ? `
    <div class="section-title">Languages (owned repos)</div>
    <div class="lang-bar">${langBar}</div>
    <div class="lang-legend">${langLegend}</div>` : '';

  show(`
    <div>
      <strong style="font-size:1.1rem;">${d.name ? `${d.name} (${d.username})` : d.username}</strong>
      ${badges(d,'user')}
      ${d.bio ? `<div style="font-size:0.875rem;color:#8b949e;margin-top:4px;">${d.bio}</div>` : ''}
      ${metaParts ? `<div class="meta" style="margin-top:6px;">${metaParts}</div>` : ''}
      <div class="stats">
        <div class="stat-item"><div class="value">${d.public_repos}</div><div class="label">Repos</div></div>
        <div class="stat-item"><div class="value">${d.followers}</div><div class="label">Followers</div></div>
        <div class="stat-item"><div class="value">${d.following}</div><div class="label">Following</div></div>
        <div class="stat-item"><div class="value">${d.total_events}</div><div class="label">Events</div></div>
      </div>
    </div>
    ${langSection}
    <div class="section-title">Recent Activity</div>
    <div class="ev-grid">${evCards}</div>`);
}

function renderRepo(d) {
  const total = Object.values(d.languages).reduce((a,b)=>a+b,0) || 1;
  const langBar = Object.entries(d.languages).map(([l,n])=>
    `<div style="width:${(n/total*100).toFixed(1)}%;background:${langColor(l)};"></div>`).join('');
  const langLegend = Object.entries(d.languages).slice(0,8).map(([l,n])=>
    `<span class="lang-item"><span class="lang-dot" style="background:${langColor(l)};"></span>${l} ${(n/total*100).toFixed(1)}%</span>`).join('');
  const contribs = (d.contributors||[]).map(c=>
    `<div class="contrib-item"><img src="${c.avatar_url}" alt="${c.username}"><div><div class="c-name">${c.username}</div><div class="c-count">${c.contributions} commits</div></div></div>`).join('');
  const topicHtml = (d.topics||[]).length
    ? `<div class="topics">${d.topics.map(t=>`<span class="topic">${t}</span>`).join('')}</div>` : '';

  const repoMeta = [
    d.license ? `📄 ${d.license}` : '',
    d.latest_release ? `🏷️ ${d.latest_release}${d.latest_release_at ? ' (' + d.latest_release_at.slice(0,10) + ')' : ''}` : '',
  ].filter(Boolean).join(' &nbsp;·&nbsp; ');

  show(`
    <div>
      <span style="font-size:1.2rem;font-weight:700;color:#58a6ff;">${d.full_name}</span>
      ${badges(d,'repo')}
      ${d.description ? `<div style="font-size:0.875rem;color:#8b949e;margin-top:4px;">${d.description}</div>` : ''}
      ${repoMeta ? `<div class="meta" style="margin-top:6px;">${repoMeta}</div>` : ''}
    </div>
    <div class="stats" style="margin-top:12px;">
      <div class="stat-item"><div class="value">⭐ ${d.stars.toLocaleString()}</div><div class="label">Stars</div></div>
      <div class="stat-item"><div class="value">🍴 ${d.forks.toLocaleString()}</div><div class="label">Forks</div></div>
      <div class="stat-item"><div class="value">${d.open_issues}</div><div class="label">Open Issues</div></div>
      ${d.language ? `<div class="stat-item"><div class="value">${d.language}</div><div class="label">Language</div></div>` : ''}
      ${d.commits_last_30d != null ? `<div class="stat-item"><div class="value">${d.commits_last_30d}</div><div class="label">Commits (30d)</div></div>` : ''}
    </div>
    ${topicHtml}
    ${Object.keys(d.languages).length ? `
      <div class="section-title">Languages</div>
      <div class="lang-bar">${langBar}</div>
      <div class="lang-legend">${langLegend}</div>` : ''}
    ${contribs ? `<div class="section-title">Top Contributors</div><div class="contrib-list">${contribs}</div>` : ''}
    <div class="meta">Updated: ${d.updated_at.slice(0,10)}</div>`);
}

function renderPR(d) {
  const stateClass = { open:'state-open', closed:'state-closed', merged:'state-merged' }[d.state] || 'state-open';
  const reviewers = d.reviewers.length
    ? `<div class="meta">Reviewers: ${d.reviewers.join(', ')}</div>` : '';
  show(`
    <div>
      <span style="font-size:1.05rem;font-weight:700;">#${d.number} ${d.title}</span>
      <span class="state-badge ${stateClass}">${d.state}</span>
      ${badges(d,'pr')}
    </div>
    <div class="stats" style="margin-top:12px;">
      <div class="stat-item"><div class="value">${d.changed_files}</div><div class="label">Files</div></div>
      <div class="stat-item"><div class="value"><span class="diff-add">+${d.additions}</span></div><div class="label">Additions</div></div>
      <div class="stat-item"><div class="value"><span class="diff-del">-${d.deletions}</span></div><div class="label">Deletions</div></div>
      <div class="stat-item"><div class="value">${d.comments + d.review_comments}</div><div class="label">Comments</div></div>
    </div>
    <div class="meta">Author: <strong>${d.author}</strong> · ${d.base} ← ${d.head}</div>
    ${reviewers}
    <div class="meta">Opened: ${d.created_at.slice(0,10)}${d.merged_at ? ' · Merged: ' + d.merged_at.slice(0,10) : ''}</div>
    <button class="review-btn" id="reviewBtn" onclick="fetchReview()">🤖 AI Review</button>
    <div id="reviewSection"></div>`);
}

function mdToHtml(md) {
  return md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, m => `<ul>${m}</ul>`)
    .replace(/^(?!<[hul])(.+)$/gm,'<p>$1</p>')
    .replace(/<p><\/p>/g,'');
}

async function fetchReview() {
  const url = document.getElementById('urlInput').value.trim();
  const btn = document.getElementById('reviewBtn');
  const sec = document.getElementById('reviewSection');
  btn.disabled = true;
  btn.textContent = '⏳ Reviewing…';
  sec.innerHTML = '';
  try {
    const res = await fetch(`${API}/api/review?url=${encodeURIComponent(url)}`);
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || e.error || res.statusText); }
    const r = await res.json();
    const cached = r.cached ? '<span class="badge cached">cached</span>' : '<span class="badge">live</span>';
    sec.innerHTML = `<div class="section-title">AI Review ${cached}</div><div class="review-box">${mdToHtml(r.markdown)}</div>`;
    btn.textContent = '🤖 AI Review';
    btn.disabled = false;
  } catch(e) {
    sec.innerHTML = `<span class="err">Review error: ${e.message}</span>`;
    btn.textContent = '🤖 AI Review';
    btn.disabled = false;
  }
}

function renderIssue(d) {
  const stateClass = d.state === 'open' ? 'state-open' : 'state-closed';
  const labelHtml = d.labels.length
    ? `<div class="labels">${d.labels.map(l=>`<span class="label-tag">${l}</span>`).join('')}</div>` : '';
  const assignees = d.assignees.length
    ? `<div class="meta">Assignees: ${d.assignees.join(', ')}</div>` : '';
  show(`
    <div>
      <span style="font-size:1.05rem;font-weight:700;">#${d.number} ${d.title}</span>
      <span class="state-badge ${stateClass}">${d.state}</span>
      ${badges(d,'issue')}
    </div>
    ${labelHtml}
    <div class="stats" style="margin-top:12px;">
      <div class="stat-item"><div class="value">${d.comments}</div><div class="label">Comments</div></div>
    </div>
    <div class="meta">Author: <strong>${d.author}</strong></div>
    ${assignees}
    <div class="meta">Opened: ${d.created_at.slice(0,10)}${d.closed_at ? ' · Closed: ' + d.closed_at.slice(0,10) : ''}</div>`);
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchAnalyze();
});
</script>
</body>
</html>
